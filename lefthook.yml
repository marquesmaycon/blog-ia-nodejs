# https://lefthook.dev/configuration/
pre-commit:
  jobs:
    - name: lint-staged
      run: npx lint-staged

commit-msg:
  jobs:
    - name: commitlint
      run: npx commitlint --edit {1}

pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: npm run typecheck
    - name: lint
      run: npm run lint
    - name: format
      run: npm run format:check
